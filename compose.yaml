services:
  db:
    image: postgres:16
    container_name: ai_trainer_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_trainer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_trainer"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    image: ai-trainer-backend:local
    build:
      context: ./backend
    container_name: ai_trainer_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ai_trainer
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 30s

  worker:
    image: ai-trainer-backend:local
    build:
      context: ./backend
    container_name: ai_trainer_worker
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ai_trainer
      PYTHONUNBUFFERED: "1"
      TRAINING_WORKER_THREADS: "1"
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    command: python -m training.worker
    stop_grace_period: 1m

  frontend:
    build:
      context: ./frontend
    container_name: ai_trainer_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0

  adminer:
    image: adminer:latest
    container_name: ai_trainer_adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  frontend_node_modules:
